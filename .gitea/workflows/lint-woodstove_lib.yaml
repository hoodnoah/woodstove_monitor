name: Lint woodstove_lib

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'woodstove_lib/**'

jobs:
  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woodstove_lib
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy -- -D warnings
